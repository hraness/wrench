<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#181817">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="{{WRENCH_DESCRIPTION}}">
    <title>Page not found · Wrench</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{CSS_ASSET}}">
    <meta name="wrench-posthog-host" content="{{POSTHOG_HOST}}">
    <meta name="wrench-posthog-key" content="{{POSTHOG_KEY}}">
    <script type="application/ld+json">{{JSON_LD}}</script>
    <script type="module" src="{{ANALYTICS_ASSET}}"></script>
  </head>
  <body>
    <main class="route-state">
      <p class="eyebrow">404 · Wrench {{WRENCH_VERSION}}</p>
      <h1>This handle does not exist.</h1>
      <p>The address may have changed. The Wrench project and its current {{WRENCH_RELEASE}} installation guide are still at the canonical home.</p>
      <a class="button button-primary" href="/">Return to wrench.rip</a>
      <p class="visually-hidden">Current install command: {{WRENCH_INSTALL_COMMAND}}</p>
    </main>
  </body>
</html>
