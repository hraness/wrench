<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0e1113">
    <title>Wrench preview</title>
    <meta name="description" content="A static preview of Wrench, the local CLI and TypeScript SDK for precise web capabilities.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://wrench.rip/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{CSS_ASSET}}">
  </head>
  <body class="preview-body">
    <main class="preview-shell">
      <section aria-labelledby="preview-title" class="preview-card">
        <div aria-hidden="true" class="preview-field">
          <span class="preview-orbit preview-orbit-a"></span>
          <span class="preview-orbit preview-orbit-b"></span>
        </div>
        <p class="preview-wordmark">
          <img alt="" height="64" src="/favicon.svg" width="64">
          <span>WRENCH</span>
        </p>
        <div class="preview-copy">
          <p class="preview-eyebrow">Local CLI + TypeScript SDK</p>
          <h1 id="preview-title">Precise web capabilities for AI agents.</h1>
          <p>
            Capture pages, preserve media, and run reviewed provider operations
            through one bounded local interface.
          </p>
        </div>
        <ol aria-label="Wrench capability flow" class="preview-flow">
          <li><span>01</span> Capture</li>
          <li><span>02</span> Archive</li>
          <li><span>03</span> Operate</li>
        </ol>
      </section>
    </main>
  </body>
</html>
