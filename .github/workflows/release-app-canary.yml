name: Prove release App canary

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: wrench-release-app-canary-single-use
  cancel-in-progress: false

jobs:
  preflight:
    name: Bind single-use canary source and controls
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      receipt: ${{ steps.canary.outputs.receipt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Fetch only bounded governed main history
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          readonly expected_ref=refs/remotes/origin/main
          while IFS= read -r ref; do
            test -z "$ref" || test "$ref" = "$expected_ref"
          done < <(git for-each-ref --format='%(refname)' refs/heads refs/remotes refs/tags)
          git fetch --force --no-tags --prune --no-recurse-submodules --depth=32 \
            https://github.com/hraness/wrench.git \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse --verify "$expected_ref^{commit}")" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git for-each-ref --format='%(refname)' refs/heads refs/remotes refs/tags)" = "$expected_ref"
          test "$(git rev-list --all --count)" -le 32
          git cat-file -e 6d9096b0fabbc03ede0741ec4931fbe19127440c^{commit}
          git cat-file -e 0bf88a064233635e0c5485c61f9c533974a7dca4^{commit}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Preflight exact current-main canary coordinate
        id: canary
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node ./scripts/release-app-canary.mjs preflight

  prove:
    name: Prove one dedicated-App leased canary transition
    needs: preflight
    permissions:
      actions: read
      contents: read
    environment: { name: production-ref-writer-key, deployment: false }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      evidence: ${{ steps.canary.outputs.evidence }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Fetch only bounded governed main history
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          readonly expected_ref=refs/remotes/origin/main
          while IFS= read -r ref; do
            test -z "$ref" || test "$ref" = "$expected_ref"
          done < <(git for-each-ref --format='%(refname)' refs/heads refs/remotes refs/tags)
          git fetch --force --no-tags --prune --no-recurse-submodules --depth=32 \
            https://github.com/hraness/wrench.git \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse --verify "$expected_ref^{commit}")" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git for-each-ref --format='%(refname)' refs/heads refs/remotes refs/tags)" = "$expected_ref"
          test "$(git rev-list --all --count)" -le 32
          git cat-file -e 6d9096b0fabbc03ede0741ec4931fbe19127440c^{commit}
          git cat-file -e 0bf88a064233635e0c5485c61f9c533974a7dca4^{commit}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prove exact canary lease and revoked-token denial
        id: canary
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PREFLIGHT_RECEIPT: ${{ needs.preflight.outputs.receipt }}
          WRENCH_RELEASE_APP_CLIENT_ID: ${{ vars.WRENCH_RELEASE_APP_CLIENT_ID }}
          WRENCH_RELEASE_APP_ID: ${{ vars.WRENCH_RELEASE_APP_ID }}
          WRENCH_RELEASE_APP_INSTALLATION_ID: ${{ vars.WRENCH_RELEASE_APP_INSTALLATION_ID }}
          WRENCH_RELEASE_APP_PRIVATE_KEY: ${{ secrets.WRENCH_RELEASE_APP_PRIVATE_KEY }}
          WRENCH_RELEASE_APP_SLUG: ${{ vars.WRENCH_RELEASE_APP_SLUG }}
          WRENCH_RELEASE_LIFECYCLE_RULESET_ID: ${{ vars.WRENCH_RELEASE_LIFECYCLE_RULESET_ID }}
          WRENCH_RELEASE_LIFECYCLE_RULESET_UPDATED_AT: ${{ vars.WRENCH_RELEASE_LIFECYCLE_RULESET_UPDATED_AT }}
          WRENCH_RELEASE_PRODUCTION_FREEZE_RULESET_ID: ${{ vars.WRENCH_RELEASE_PRODUCTION_FREEZE_RULESET_ID }}
          WRENCH_RELEASE_PRODUCTION_FREEZE_RULESET_UPDATED_AT: ${{ vars.WRENCH_RELEASE_PRODUCTION_FREEZE_RULESET_UPDATED_AT }}
          WRENCH_RELEASE_UPDATE_RULESET_ID: ${{ vars.WRENCH_RELEASE_UPDATE_RULESET_ID }}
          WRENCH_RELEASE_UPDATE_RULESET_UPDATED_AT: ${{ vars.WRENCH_RELEASE_UPDATE_RULESET_UPDATED_AT }}
        run: node ./scripts/release-app-canary.mjs prove
      - name: Publish retrievable bounded canary evidence
        env:
          CANARY_EVIDENCE: ${{ steps.canary.outputs.evidence }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node ./scripts/release-app-canary.mjs publish-evidence
