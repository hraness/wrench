name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact stable release tag to verify and recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      recovery_workflow_sha: ${{ steps.recovery_source.outputs.sha }}
      verified_sha: ${{ steps.identity.outputs.sha }}
      verified_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Resolve release request
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              if [[ "$EVENT_REF_TYPE" != "tag" || "$EVENT_REF" != "refs/tags/$EVENT_REF_NAME" ]]; then
                echo "::error::Release push is not one exact tag ref"
                exit 1
              fi
              requested_tag="$EVENT_REF_NAME"
              ;;
            workflow_dispatch)
              expected_ref="refs/heads/$DEFAULT_BRANCH"
              if [[ "$EVENT_REF" != "$expected_ref" ]]; then
                echo "::error::Release recovery must run from $expected_ref, not $EVENT_REF"
                exit 1
              fi
              requested_tag="$INPUT_RELEASE_TAG"
              ;;
            *)
              echo "::error::Unsupported release event $EVENT_NAME"
              exit 1
              ;;
          esac
          if [[ ! "$requested_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release request is not one stable semantic-version tag"
            exit 1
          fi
          printf 'tag=%s\n' "$requested_tag" >> "$GITHUB_OUTPUT"
      - name: Bind recovery workflow source
        id: recovery_source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              printf 'sha=\n' >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              if [[ ! "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Release recovery has no exact workflow source commit"
                exit 1
              fi
              current_default_sha="$(gh api \
                "/repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" \
                --jq '.object.sha')"
              if [[ "$current_default_sha" != "$EVENT_SHA" ]]; then
                echo "::error::Release recovery workflow source $EVENT_SHA is not current $DEFAULT_BRANCH head $current_default_sha"
                exit 1
              fi
              printf 'sha=%s\n' "$EVENT_SHA" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported release event $EVENT_NAME"
              exit 1
              ;;
          esac
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ steps.request.outputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$REQUESTED_TAG" != "$expected_tag" ]]; then
            echo "::error::Tag $REQUESTED_TAG does not match package version $expected_tag"
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")"
          head_commit="$(git rev-parse --verify "HEAD^{commit}")"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::Checked-out source $head_commit does not match tag commit $tag_commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $REQUESTED_TAG is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$REQUESTED_TAG" ]]; then
            echo "::error::Tag $REQUESTED_TAG is not newer than $newest_stable_tag"
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all(["./dist/index.js","./dist/client.js","./dist/beeper-client.js","./dist/omni-client.js","./dist/messaging.js"].map((path) => import(path)))'
      - name: Verify exact public npm delivery
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          package_spec="$package_name@$package_version"
          source_directory="$RUNNER_TEMP/wrench-release-source"
          registry_directory="$RUNNER_TEMP/wrench-release-registry"
          source_json="$RUNNER_TEMP/wrench-release-source.json"
          registry_json="$RUNNER_TEMP/wrench-release-registry.json"
          registry_view_json="$RUNNER_TEMP/wrench-release-registry-view.json"
          mkdir -p "$source_directory" "$registry_directory"

          npm pack \
            --ignore-scripts \
            --json \
            --pack-destination "$source_directory" \
            --registry=https://registry.npmjs.org > "$source_json"
          npm pack "$package_spec" \
            --ignore-scripts \
            --json \
            --pack-destination "$registry_directory" \
            --registry=https://registry.npmjs.org > "$registry_json"
          npm view "$package_spec" name version dist \
            --json \
            --registry=https://registry.npmjs.org > "$registry_view_json"

          source_name="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(value) || value.length !== 1 || typeof value[0].filename !== "string") process.exit(1); process.stdout.write(value[0].filename)' "$source_json")"
          registry_name="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(value) || value.length !== 1 || typeof value[0].filename !== "string") process.exit(1); process.stdout.write(value[0].filename)' "$registry_json")"
          if [[ "$source_name" != "$registry_name" ]]; then
            echo "::error::Source tarball $source_name does not match registry tarball $registry_name"
            exit 1
          fi
          source_archive="$source_directory/$source_name"
          registry_archive="$registry_directory/$registry_name"
          bun run ./scripts/npm-package-identity.ts \
            --source-archive "$source_archive" \
            --source-pack-json "$source_json" \
            --registry-archive "$registry_archive" \
            --registry-pack-json "$registry_json" \
            --registry-view-json "$registry_view_json" \
            --expected-name "$package_name" \
            --expected-version "$package_version"
          bun run ./scripts/package-smoke.ts \
            --archive "$registry_archive" \
            --pack-json "$registry_json"

  provider_baseline:
    name: Snapshot provider baseline
    needs: verify
    permissions:
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      receipt: ${{ steps.baseline.outputs.receipt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.verify.outputs.recovery_workflow_sha || needs.verify.outputs.verified_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Snapshot Production deployments before promotion
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: node ./scripts/release-provider-outcome.mjs baseline

  publish:
    name: Publish
    needs:
      - verify
      - provider_baseline
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      promotion_receipt: ${{ steps.promotion.outputs.receipt }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EVENT_NAME: ${{ github.event_name }}
      RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.recovery_workflow_sha }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.verify.outputs.recovery_workflow_sha || needs.verify.outputs.verified_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Publish request has no verified stable release tag"
            exit 1
          fi
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publish request has no verified release commit"
            exit 1
          fi
          remote_tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/tags/$VERIFIED_TAG" --jq '.sha')"
          if [[ "$remote_tag_sha" != "$VERIFIED_SHA" ]]; then
            echo "::error::Remote $VERIFIED_TAG resolves to $remote_tag_sha, expected $VERIFIED_SHA"
            exit 1
          fi
          release_endpoint="/repos/$GITHUB_REPOSITORY/releases/tags/$VERIFIED_TAG"
          release_lookup_stderr="$(mktemp)"
          trap 'rm -f "$release_lookup_stderr"' EXIT
          set +e
          release_lookup="$(gh api --include "$release_endpoint" 2>"$release_lookup_stderr")"
          release_lookup_exit="$?"
          set -e
          release_lookup_state="$(printf '%s' "$release_lookup" | \
            node ./scripts/release-provider-outcome.mjs inspect-release-response)"
          case "$release_lookup_state" in
            found)
              if [[ "$release_lookup_exit" -ne 0 ]]; then
                echo "::error::Exact Release lookup returned a Release with exit $release_lookup_exit"
                exit 1
              fi
              ;;
            missing)
              if [[ "$release_lookup_exit" -ne 1 ]]; then
                echo "::error::Exact Release absence returned unexpected exit $release_lookup_exit"
                exit 1
              fi
              ;;
            *)
              echo "::error::Exact Release lookup returned an unsupported state"
              exit 1
              ;;
          esac
          if [[ "$release_lookup_state" == "missing" ]]; then
            node ./scripts/release-provider-outcome.mjs release-order
            node ./scripts/release-provider-outcome.mjs revalidate-source
            created_release="$(gh api \
              --method POST \
              "/repos/$GITHUB_REPOSITORY/releases" \
              -F draft=false \
              -F generate_release_notes=true \
              -f make_latest=true \
              -f name="Wrench $VERIFIED_TAG" \
              -F prerelease=false \
              -f tag_name="$VERIFIED_TAG" \
              -f target_commitish="$VERIFIED_SHA")"
            printf '%s' "$created_release" | \
              node ./scripts/release-provider-outcome.mjs validate-release
          fi
          release_readback="$(gh api "$release_endpoint")"
          printf '%s' "$release_readback" | \
            node ./scripts/release-provider-outcome.mjs validate-release
          latest_tag="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ "$latest_tag" != "$VERIFIED_TAG" ]]; then
            echo "::error::Latest release is $latest_tag, expected $VERIFIED_TAG"
            exit 1
          fi
      - name: Promote verified website production source
        id: promotion
        env:
          BASELINE_RECEIPT: ${{ needs.provider_baseline.outputs.receipt }}
        run: node ./scripts/release-provider-outcome.mjs promote

  provider_outcome:
    name: Verify provider outcome
    needs:
      - verify
      - provider_baseline
      - publish
    permissions:
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.verify.outputs.recovery_workflow_sha || needs.verify.outputs.verified_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify exact Vercel Production outcome
        env:
          BASELINE_RECEIPT: ${{ needs.provider_baseline.outputs.receipt }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RECEIPT: ${{ needs.publish.outputs.promotion_receipt }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.recovery_workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: node ./scripts/release-provider-outcome.mjs wait
